<!-- ===================== CONTRÔLE D'ÂGE ===================== -->
<div class="agegate" id="agegate" hidden>

    <p data-i18n="age.text"></p>
    <div class="agegate-actions">
      <button class="btn btn-primary btn-block" id="ageYes" data-i18n="age.yes"></button>
      <button class="btn btn-ghost btn-block" id="ageNo" data-i18n="age.no"></button>
    </div>
    <p class="denied" id="ageDenied" hidden data-i18n="age.denied"></p>
    <small data-i18n="age.legal"></small>
    <div class="lang-switch small" id="ageLang">
      <button data-lang="fr">Français</button>
      <button data-lang="ar">العربية</button>
    </div>
  </div>
</div>

<!-- ===================== BANDEAU ===================== -->
<div class="topbar">
  <div class="wrap">
    <span data-i18n="top.delivery"></span>
    <span data-i18n="top.open"></span>
    <span data-i18n="top.pay"></span>
  </div>
</div>

<!-- ===================== HEADER ===================== -->
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="#top">
      <img src="assets/img/logo.png" alt="Vape One Shop" onerror="this.onerror=null;this.src='assets/img/logo.svg'">
      <span class="brand-text">
        <strong class="display">Vape One Shop</strong>
        <small>Oujda · Maroc</small>
      </span>

    <nav class="main-nav" id="mainNav">
      <a href="#boutique" data-i18n="nav.shop"></a>
      <a href="#rechargeable" data-i18n="nav.recharge"></a>
      <a href="#livraison" data-i18n="nav.delivery"></a>
      <a href="#magasin" data-i18n="nav.store"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>

    <div class="header-actions">
      <div class="lang-switch" id="langSwitch">
        <button data-lang="fr">FR</button>
        <button data-lang="ar">ع</button>
      </div>
      <button class="icon-btn burger" id="burger" aria-label="Menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>

      <button class="icon-btn" id="openCart" aria-label="Panier">

</header>

<main id="top">

          <div><strong data-i18n="hero.stat3v"></strong><span data-i18n="hero.stat3"></span></div>
        </div>
      </div>
      <div class="hero-card">
        <img src="assets/img/logo.png" alt="Vape One Shop, Oujda" onerror="this.onerror=null;this.src='assets/img/logo.svg'">

    </div>

    <div class="wrap">
      <div class="perks">
        <div class="perk">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
          <div><strong data-i18n="perk1.t"></strong><span data-i18n="perk1.s"></span></div>
        </div>
        <div class="perk">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <div><strong data-i18n="perk2.t"></strong><span data-i18n="perk2.s"></span></div>
        </div>
        <div class="perk">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/></svg></span>
          <div><strong data-i18n="perk3.t"></strong><span data-i18n="perk3.s"></span></div>
        </div>
        <div class="perk">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-9A8.4 8.4 0 1 1 21 11.5z"/></svg></span>
          <div><strong data-i18n="perk4.t"></strong><span data-i18n="perk4.s"></span></div>
        </div>
      </div>
    </div>

  <!-- ===================== CATALOGUE ===================== -->

        <div>

  <!-- ===================== RECHARGEABLE ===================== -->

      <div class="banner">

            <li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="rc.li2"></span></li>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>

  </div>
  <div class="ship-bar">
    <span id="shipMsg"></span>

      <div class="grand"><span data-i18n="cart.total"></span><span id="grandTotal"></span></div>
    </div>
    <button class="btn btn-wa btn-block" id="checkout" data-wa="cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.4-.7-1.7-.8s-.4-.1-.5.1-.6.8-.7 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.6-1.2a.4.4 0 0 0 0-.4c0-.1-.5-1.3-.7-1.7s-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11 11 0 0 0 4.2 3.7c1.5.6 2.1.7 2.9.6a2.5 2.5 0 0 0 1.6-1.1 2 2 0 0 0 .1-1.1c0-.1-.2-.2-.4-.3z"/></svg>
      <span data-i18n="cart.order"></span>

    <p class="pay-note" data-i18n="cart.note"></p>
  </div>
